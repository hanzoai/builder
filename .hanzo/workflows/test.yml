name: checks
on: 
  - push
  - pull_request

jobs:
  lint:
    name: check and test
    # The git-runner fleet at git.hanzo.ai is the only pool serving labels here,
    # and it stopped offering ubuntu-latest. A job asking for it is accepted and
    # then queued forever, which reads as "still running" rather than as broken.
    runs-on: hanzo-build-linux-amd64
    steps:
      - uses: actions/checkout@v4
      # go.mod is the only place the Go version is written. A pinned number here
      # drifts below the module floor and go refuses to even parse go.mod:
      #   invalid go version '1.26.4': must match format 1.23
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: go install golang.org/x/lint/golint@latest && golint ./...
      - name: vet
        run: go vet
      - name: test
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic