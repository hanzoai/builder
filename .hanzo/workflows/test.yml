name: checks
on: 
  - push
  - pull_request

jobs:
  lint:
    name: check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # go.mod is the only place the Go version is written. A pinned number here
      # drifts below the module floor and go refuses to even parse go.mod:
      #   invalid go version '1.26.4': must match format 1.23
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: go install golang.org/x/lint/golint@latest && golint ./...
      - name: vet
        run: go vet
      - name: test
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic